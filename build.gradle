mixin {
    add(sourceSets.main, 'create_central_kitchen.refmap.json')
    config('create_central_kitchen.mixins.json')
}

publishMods {
    file = reobfJar.archiveFile
    changelog = project.file("CHANGELOG.md").text
    version = mod_version
    type = STABLE
    displayName = "CCK ${mod_version} for Create ${minecraft_version}-${create_version}"
    modLoaders.add("forge")
    modLoaders.add("neoforge")

    curseforge {
        projectId = "820977"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
        client = true
        server = true
    }

    modrinth {
        projectId = "btq68HMO"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        requires("create")
    }
}

void processJar(Jar jarTask) {
    jarTask.configure {
        from "LICENSE"
        exclude ".cache"
        exclude "assets/create_central_kitchen/lang/unfinished"
        exclude "assets/create_central_kitchen/lang/default"

        manifest {
            attributes([
                "Specification-Title"     : "create_central_kitchen",
                "Specification-Vendor"    : "dragonsplus",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "dragonsplus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs': 'create_central_kitchen.mixins.json'
            ])
        }
    }
}

jar.finalizedBy('reobfJar')

processJar(jar)

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir("mcmodsrepo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

def resourceJsonFiles = fileTree('src/main/resources') {
    include '**/*.json'
    include '**/pack.mcmeta'
}

tasks.register('validateResources') {
    group = 'verification'
    description = 'Validates manually maintained JSON resources and Minecraft 1.20.1 pack metadata.'
    inputs.files(resourceJsonFiles)

    doLast {
        def failures = []
        resourceJsonFiles.files.sort().each { resource ->
            try {
                def parsed = new JsonSlurper().parse(resource, 'UTF-8')
                if (resource.name == 'pack.mcmeta' && parsed?.pack?.pack_format != 15) {
                    failures.add("${project.relativePath(resource)}: expected pack_format 15, found ${parsed?.pack?.pack_format}")
                }
            } catch (Exception exception) {
                failures.add("${project.relativePath(resource)}: ${exception.message}")
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("Invalid manually maintained resources:\n" + failures.join('\n'))
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('validateResources')
}
