import groovy.json.JsonSlurper

plugins {
    id 'idea'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
    id "net.neoforged.moddev.legacyforge" version "2.0.143"
    id "com.diffplug.spotless" version "8.9.0"
}

base {
    archivesName = "create_central_kitchen-${artifact_minecraft_version}-for-create-${create_version}"
    group = 'plus.dragons.createcentralkitchen'
    version = mod_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

spotless {
    java {
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile("codeformat/formatter-config.xml")
    }
}

legacyForge {
    version = "$minecraft_version-$forge_version"

    // TODO - Try turning this on later see Create
    validateAccessTransformers = false
    accessTransformers.from(file("src/main/resources/META-INF/accesstransformer.cfg"))

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_version
    }

    mods {
        create_central_kitchen {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        // applies to all the run configs below
        configureEach {
            systemProperty('forge.logging.markers', '')
            systemProperty('forge.logging.console.level', 'info')
            jvmArguments = ["-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"]
            //jvmArgs("-XX:-OmitStackTraceInFastThrow") // uncomment when you get exceptions with null messages etc
            //jvmArgs '-XX:+UnlockCommercialFeatures' // uncomment for profiling

            systemProperty('mixin.debug.export', 'true')
            systemProperty('mixin.debug.verbose', 'true')

            programArgument('-mixin.config=create_central_kitchen.mixins.json')
        }

        client {
            client()

            gameDirectory = project.file('run')
        }

        server {
            server()

            gameDirectory = project.file('run/server')
        }

        gameTestServer {
            type = "gameTestServer"

            gameDirectory = project.file('run/gametest')
            systemProperty('forge.enabledGameTestNamespaces', 'create_central_kitchen')
            // setForceExit false <- FIXME 1.20  see Create
        }
    }
}

